<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#bgGrad)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>

  <!-- Geometric Accent Circles -->
  <circle cx="1600" cy="200" r="350" fill="#D97706" opacity="0.08" filter="blur(60px)"/>
  <circle cx="300" cy="650" r="300" fill="#38BDF8" opacity="0.08" filter="blur(60px)"/>

  <!-- Content Group -->
  <g transform="translate(140, 360)">
    <!-- Category / Tag -->
    <rect x="0" y="-120" width="380" height="38" rx="19" fill="#D97706" fill-opacity="0.2" stroke="#D97706" stroke-width="1.5"/>
    <text x="20" y="-95" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
      SLOT WARTA AKBAR &amp; BANNER IKLAN
    </text>

    <!-- Main Title -->
    <text x="0" y="-30" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Kerukunan Keluarga Soppeng Kabupaten Mimika
    </text>

    <!-- Subtitle -->
    <text x="0" y="30" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
      Simpul Silaturahmi, Solidaritas Sosial &amp; Wadah Persaudaraan di Tanah Amungsa
    </text>

    <!-- Admin notice -->
    <rect x="0" y="80" width="700" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="107" fill="#38BDF8" font-family="monospace" font-size="15" font-weight="600">
      [Gambar Lokal: Masukkan file foto ke apps/web/public/images/hero-banner.jpg]
    </text>
  </g>
</svg>
